<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BPMN Architect Service{% endblock %}</title>
  <link rel="icon" href="/static/img/bpmn-architect-logo.svg" type="image/svg+xml">

  <!-- Bootswatch Lumen Theme with CDN Fallback -->
  <link rel="stylesheet" id="bootswatch-theme-css" href="/app/assets/vendor/bootswatch/lumen/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lumen/bootstrap.min.css';">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    :root {
      --bpmn-primary: #158cba;
      --bpmn-primary-dark: #117095;
      --bpmn-surface: #f8fafc;
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-shadow: 0 4px 20px rgba(21, 140, 186, 0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: #334155;
    }
    .navbar-service {
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .ribbon-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: #1e293b;
      letter-spacing: -0.01em;
    }
    .ribbon-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #158cba 0%, #117095 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      box-shadow: 0 2px 6px rgba(21, 140, 186, 0.3);
    }
    .card-custom {
      background: #ffffff;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-custom:hover {
      box-shadow: 0 8px 24px rgba(21, 140, 186, 0.09);
    }
    .stat-val {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .table td, .table th {
      vertical-align: middle;
      font-size: 0.85rem;
    }
    footer.service-footer {
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      font-size: 0.8rem;
      color: #64748b;
      padding: 0.75rem 1.5rem;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-service sticky-top px-3">
    <div class="container-fluid">
      <a href="/" class="ribbon-brand text-decoration-none">
        <img src="/static/img/bpmn-architect.svg" alt="BPMN Architect" height="32" class="d-inline-block">
        <span class="badge bg-light text-muted border fw-normal ms-1" style="font-size:0.75rem;">Microservice</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#serviceNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="serviceNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item">
            <a class="nav-link" href="/">
              <i class="bi bi-activity me-1"></i>Status
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="/admin">
              <i class="bi bi-shield-lock me-1"></i>Admin
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/docs" target="_blank">
              <i class="bi bi-journal-code me-1"></i>Swagger API
            </a>
          </li>
          
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a href="/admin" class="btn btn-sm btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Admin Login</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Service Footer -->
  <footer class="service-footer mt-auto d-flex flex-wrap align-items-center justify-content-between">
    <div>
      <i class="bi bi-shield-check text-success me-1"></i>
      <strong>BPMN Architect Service</strong> &bull; Collaborative BPMN 2.0 Microservice & SVG Renderer
    </div>
    <div class="text-muted">
      Theme: <span class="badge bg-secondary-subtle text-secondary border font-monospace">Lumen</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
